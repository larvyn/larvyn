<!doctype html>
<!--
  Mailpit inbox. Plain HTML and JS, no build step.

  Inside Larvyn the view has no network access of its own: it asks Larvyn
  to fetch for it (network.fetch), and Larvyn only fetches from the hosts
  listed under "network" in larvyn.json, here localhost:8025. That also
  means Mailpit needs no CORS setting. Opened directly in a browser, for
  testing, it falls back to fetch(), which needs mailpit --api-cors.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail</title>
<style>
  :root { color-scheme: dark; font: 13px/1.4 system-ui, sans-serif; }
  body { margin: 0; padding: 12px; background: #09090b; color: #e4e4e7; }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; }
  button { background: #27272a; color: inherit; border: 1px solid #3f3f46; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 8px 0; border-bottom: 1px solid #27272a; }
  .subject { font-weight: 600; }
  .meta, .empty { color: #a1a1aa; font-size: 12px; }
</style>
</head>
<body>
<h1>Mail <button id="refresh">Refresh</button></h1>
<ul id="list"></ul>
<p class="empty" id="empty" hidden></p>
<script>
const API = "http://localhost:8025/api/v1/messages?limit=50";

function show(text) {
  document.getElementById("list").replaceChildren();
  const p = document.getElementById("empty");
  p.textContent = text;
  p.hidden = false;
}

// getJSON reads a URL through Larvyn when running inside it.
async function getJSON(url) {
  if (window.larvyn) {
    const res = await window.larvyn.call("network.fetch", { url });
    if (res.status !== 200) throw new Error(`HTTP ${res.status}`);
    return JSON.parse(res.body);
  }
  return (await fetch(url)).json();
}

async function load() {
  let data;
  try {
    data = await getJSON(API);
  } catch {
    show("Mailpit isn't running. Start it from the stack, and point MAIL_HOST=127.0.0.1 and MAIL_PORT=1025 at it in .env.");
    return;
  }
  const messages = data.messages || [];
  if (messages.length === 0) {
    show("No mail yet.");
    return;
  }
  document.getElementById("empty").hidden = true;
  document.getElementById("list").replaceChildren(...messages.map((m) => {
    const li = document.createElement("li");
    const subject = document.createElement("div");
    subject.className = "subject";
    subject.textContent = m.Subject || "(no subject)";
    const meta = document.createElement("div");
    meta.className = "meta";
    const to = (m.To || []).map((a) => a.Address).join(", ");
    meta.textContent = `${m.From?.Address ?? ""} → ${to} · ${new Date(m.Created).toLocaleString()}`;
    li.append(subject, meta);
    return li;
  }));
}

document.getElementById("refresh").addEventListener("click", load);
load();
setInterval(load, 5000);
</script>
</body>
</html>
