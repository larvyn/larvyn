# Runs the Go tests and type-checks the frontend.
#
# The repo is public, so the standard GitHub-hosted runners are free, macOS
# and Windows included. Every run tests Linux, Windows and macOS:
#
#   pull request   every push, once the PR is out of draft (Markdown-only
#                  changes skip it); a newer push cancels the older run
#   push to master the merged code
#   release        before building (release.yml calls this workflow)
#   manual         Actions tab, "Run workflow"
#
# scripts/ci-local.sh runs the same checks on your machine.

name: test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md']
  push:
    branches: [master]
    paths-ignore: ['**.md']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go and the frontend in one job. Not on a draft PR.
  linux:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      # main.go embeds frontend/dist, which is not committed; the tests do not
      # need the real build, only something for the embed to match.
      - name: Placeholder frontend build
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      # build/ holds the Wails platform templates, copied as generated.
      - name: Format
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' ':!build/'))
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend type-check
        working-directory: frontend
        run: npx tsc --noEmit

  go:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel rather than macos-latest (arm64), which lacked runner
        # capacity for days; see release.yml.
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: runner.os != 'macOS'
        with:
          go-version-file: go.mod
      # setup-go spent ~45s of a ~1m40s job on macOS: 11s downloading Go, 21s
      # copying it into the tool cache, 14s restoring a 200 MB -race build
      # cache. A plain download, a cache without -race, and saving it only from
      # master (tag and PR caches can't be reused by later runs) keep it fast.
      - name: Go (macOS)
        if: runner.os == 'macOS'
        run: |
          v=$(awk '/^go /{print $2}' go.mod)
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo amd64)
          curl -fsSL "https://go.dev/dl/go$v.darwin-$arch.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - id: go-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-macos-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-macos-${{ runner.arch }}-
      - name: Placeholder frontend build
        shell: bash
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - name: Vet
        run: go vet ./...
      # -race runs on Linux and Windows; on macOS it would double the build
      # cache and the compile time for the same checks.
      - name: Test
        shell: bash
        run: go test $([ "$RUNNER_OS" = macOS ] || echo -race) ./...
      - if: runner.os == 'macOS' && github.ref == 'refs/heads/master' && steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}
